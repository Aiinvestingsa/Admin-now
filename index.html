<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN 0789313670</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px} .card{background:#1a1a1a;padding:12px;border-radius:10px;margin:8px 0;border:1px solid #333} input,select{width:100%;padding:12px;border-radius:8px;background:#000;color:#fff;border:1px solid #555;margin:5px 0;box-sizing:border-box} .btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;margin:4px 0} .gold{background:#FFD700;color:#000} .green{background:#25D366;color:#fff} table{width:100%;font-size:11px;border-collapse:collapse} th{background:#FFD700;color:#000;padding:6px} td{padding:6px;border-bottom:1px solid #333} .hidden{display:none}</style></head><body>
<h2 style="color:#FFD700;text-align:center">👑 ADMIN - 0789313670</h2>
<div id="login" class="card"><input id="aUser" placeholder="admin"><input id="aPass" type="password" placeholder="12345"><button class="btn gold" onclick="login()">LOGIN</button><p style="font-size:10px;color:#555">Default: admin / 12345</p></div>
<div id="dash" class="hidden">
<div style="display:flex;gap:6px;flex-wrap:wrap"><div class="card" style="flex:1;text-align:center"><h2 id="tu" style="margin:0;color:#FFD700">0</h2><small>Users</small></div><div class="card" style="flex:1;text-align:center"><h2 id="au" style="margin:0;color:#00FF00">0</h2><small>Active</small></div><div class="card" style="flex:1;text-align:center"><h2 id="rev" style="margin:0;color:#FFD700">R0</h2><small>Revenue</small></div><div class="card" style="flex:1;text-align:center"><h2 id="mCount" style="margin:0">0</h2><small>Month R20</small></div><div class="card" style="flex:1;text-align:center"><h2 id="yCount" style="margin:0">0</h2><small>Year R200</small></div></div>
<div class="card"><h4>🎟️ Generate Voucher - Send to 0789313670 clients</h4>
<div style="display:flex;gap:5px"><select id="pkgType" onchange="changePkg()" style="flex:1"><option value="month">📅 1 Month R20 (30d)</option><option value="year">🔥 1 Year R200 (365d)</option><option value="custom">Custom</option></select><input id="days" type="number" value="30" style="width:25%"></div>
<div style="display:flex;gap:5px"><input id="ccode" placeholder="auto code"><button class="btn gold" onclick="genV()" style="width:40%">GENERATE</button></div>
<p id="newCode" style="color:#00FF00;font-weight:900;text-align:center"></p>
<a id="waSend" href="#" target="_blank" style="text-decoration:none"><button class="btn green hidden" id="waBtn">💬 Send Voucher via WhatsApp</button></a>
</div>
<div class="card"><h4>👥 Live Users</h4><div style="overflow:auto"><table><thead><tr><th>Name</th><th>WhatsApp</th><th>Package</th><th>Voucher</th><th>Expiry</th><th>Action</th></tr></thead><tbody id="ut"></tbody></table></div></div>
<div class="card"><h4>🎟️ Vouchers</h4><div style="overflow:auto;max-height:250px"><table><thead><tr><th>Code</th><th>Package</th><th>Days</th><th>Used</th><th>By</th><th>Action</th></tr></thead><tbody id="vt"></tbody></table></div></div>
</div>
<script>
const firebaseConfig = {apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",projectId:"YOUR_PROJECT",storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"123",appId:"1:123:web:abc"};
let db=null; try{firebase.initializeApp(firebaseConfig);db=firebase.database();}catch(e){}
function login(){let u=document.getElementById('aUser').value,p=document.getElementById('aPass').value;if((u==='admin'||u==='')&&p==='12345'){document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');load();}else alert('Wrong')}
function changePkg(){let pkg=document.getElementById('pkgType').value;document.getElementById('days').value=pkg==='year'?365:pkg==='month'?30:30;}
function load(){let users=JSON.parse(localStorage.getItem('mzansi_users')||'{}');if(db){db.ref('users').on('value',s=>renderUsers(s.val()||users));db.ref('vouchers').on('value',s=>renderVouchers(s.val()||{}));}else{renderUsers(users);renderVouchers(JSON.parse(localStorage.getItem('mzansi_vouchers')||'{}'));}}
function renderUsers(users){let total=Object.keys(users).length,active=0,mCount=0,yCount=0,rev=0,html='';for(let wa in users){let u=users[wa];let isActive=u.expiry&&u.expiry>Date.now();if(isActive){active++;if(u.package==='year'){yCount++;rev+=200;}else{mCount++;rev+=20;}}let exp=u.expiry?new Date(u.expiry).toLocaleDateString():'-';let pkgLabel=u.packageLabel||(u.package==='year'?'1 Year R200':u.package==='month'?'1 Month R20':'-');html+=`<tr><td>${u.name||'-'}</td><td><a href="https://wa.me/${wa.replace(/^0/,'27')}" target="_blank" style="color:#25D366">${wa}</a></td><td>${pkgLabel}</td><td style="font-family:monospace">${u.voucher||'-'}</td><td>${exp}</td><td><button onclick="ext('${wa}')">+30d</button> <button onclick="extYear('${wa}')">+1y</button> <button onclick="delU('${wa}')" style="color:red">X</button></td></tr>`;}document.getElementById('tu').innerText=total;document.getElementById('au').innerText=active;document.getElementById('rev').innerText='R'+rev;document.getElementById('mCount').innerText=mCount;document.getElementById('yCount').innerText=yCount;document.getElementById('ut').innerHTML=html||'<tr><td colspan=6>No users</td></tr>';}
function renderVouchers(vouchers){let html='';for(let c in vouchers){let v=vouchers[c];let label=v.label||(v.package==='year'?'1 Year R200':v.package==='month'?'1 Month R20':v.days+'d');html+=`<tr><td style="font-family:monospace">${c}</td><td>${label}</td><td>${v.days}</td><td>${v.used?'YES':'NO'}</td><td>${v.usedBy||'-'}</td><td><button onclick="copy('${c}')">Copy</button> <button onclick="delV('${c}')" style="color:red">X</button></td></tr>`;}document.getElementById('vt').innerHTML=html||'<tr><td colspan=6>No vouchers</td></tr>';}
function genV(){let pkg=document.getElementById('pkgType').value;let days=parseInt(document.getElementById('days').value)||30;if(pkg==='month')days=30;if(pkg==='year')days=365;let custom=document.getElementById('ccode').value.trim().toUpperCase();let prefix=pkg==='year'?'YEAR-':'MONTH-';let code=custom||prefix+Math.random().toString(36).substring(2,4).toUpperCase()+Math.random().toString(36).substring(2,4).toUpperCase();let price=pkg==='year'?200:20;let label=pkg==='year'?'1 YEAR R200':pkg==='month'?'1 MONTH R20':days+' days';let data={days,price,package:pkg,label,used:false,created:Date.now()};if(db)db.ref('vouchers/'+code).set(data);else{let v=JSON.parse(localStorage.getItem('mzansi_vouchers')||'{}');v[code]=data;localStorage.setItem('mzansi_vouchers',JSON.stringify(v));load();}document.getElementById('newCode').innerHTML='✅ NEW: '+code+' - '+label;let waMsg='Your Mzansi Battery voucher: '+code+' ('+label+') - Valid '+days+' days. Thank you! Help: 0789313670';document.getElementById('waSend').href='https://wa.me/?text='+encodeURIComponent(waMsg);document.getElementById('waBtn').classList.remove('hidden');navigator.clipboard.writeText(code);document.getElementById('ccode').value='';}
function ext(wa){if(db)db.ref('users/'+wa).once('value',s=>{let u=s.val();let exp=u.expiry&&u.expiry>Date.now()?u.expiry:Date.now();db.ref('users/'+wa).update({expiry:exp+30*86400000});});else{let users=JSON.parse(localStorage.getItem('mzansi_users')||'{}');if(users[wa]){users[wa].expiry=(users[wa].expiry>Date.now()?users[wa].expiry:Date.now())+30*86400000;localStorage.setItem('mzansi_users',JSON.stringify(users));load();}}}
function extYear(wa){if(db)db.ref('users/'+wa).once('value',s=>{let u=s.val();let exp=u.expiry&&u.expiry>Date.now()?u.expiry:Date.now();db.ref('users/'+wa).update({expiry:exp+365*86400000});});else{let users=JSON.parse(localStorage.getItem('mzansi_users')||'{}');if(users[wa]){users[wa].expiry=(users[wa].expiry>Date.now()?users[wa].expiry:Date.now())+365*86400000;localStorage.setItem('mzansi_users',JSON.stringify(users));load();}}}
function delU(wa){if(confirm('Delete '+wa+'?')){if(db)db.ref('users/'+wa).remove();else{let users=JSON.parse(localStorage.getItem('mzansi_users')||'{}');delete users[wa];localStorage.setItem('mzansi_users',JSON.stringify(users));load();}}}
function delV(c){if(confirm('Delete '+c+'?')){if(db)db.ref('vouchers/'+c).remove();else{let v=JSON.parse(localStorage.getItem('mzansi_vouchers')||'{}');delete v[c];localStorage.setItem('mzansi_vouchers',JSON.stringify(v));load();}}}
function copy(c){navigator.clipboard.writeText(c);alert('Copied: '+c);}
</script></body></html>
